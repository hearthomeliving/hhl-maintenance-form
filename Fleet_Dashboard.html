<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHL Fleet Dashboard (Sandbox)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1f2733; --muted: #6b7686;
    --green: #16a34a; --amber: #d97706; --red: #dc2626; --blue: #2563eb;
    --border: #e3e8ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  header { background: linear-gradient(120deg, #0f172a 0%, #1e3a5f 100%); color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; box-shadow: 0 2px 10px rgba(16,24,40,.25); }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .badge-sandbox { background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: .5px; }
  .header-stats { margin-left: auto; display: flex; gap: 18px; font-size: 12.5px; color: #b7c3d6; flex-wrap: wrap; }
  .header-stats b { color: #fff; font-size: 14px; }
  .header-stats b.alert { color: #fca5a5; }
  #map { height: 32vh; min-height: 240px; width: auto; margin: 14px 20px 0; border-radius: 14px; border: 1px solid #d4dbe5; box-shadow: 0 2px 8px rgba(16,24,40,.08); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 10px; padding: 10px 20px 4px; }
  .card { background: var(--card); border: 1px solid #dde4ec; border-left: 5px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 3px rgba(16,24,40,.07); cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .card:hover { box-shadow: 0 8px 20px rgba(16,24,40,.14); transform: translateY(-2px); }
  .card.comp-ok { border-left-color: var(--green); }
  .card.comp-warn { border-left-color: var(--amber); }
  .card.comp-bad { border-left-color: var(--red); }
  .card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; flex-wrap: wrap; }
  .veh-line { font-size: 12.5px; color: var(--ink); margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  #overlay { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: none; align-items: flex-start; justify-content: center; padding: 30px 14px; z-index: 1000; overflow: auto; }
  #overlay.open { display: flex; }
  .detail { background: #fff; border-radius: 14px; max-width: 680px; width: 100%; padding: 24px 26px; box-shadow: 0 10px 40px rgba(16,24,40,.35); }
  .detail h2 { font-size: 18px; margin-bottom: 2px; display: flex; align-items: center; gap: 10px; }
  .detail .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
  .drow { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #e3e8ef; }
  .drow .label { color: var(--muted); }
  .drow .val { text-align: right; }
  .dsec { grid-column: 1 / -1; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; padding: 13px 0 2px; }
  .dwide { grid-column: 1 / -1; font-size: 12.5px; color: var(--amber); padding: 6px 0; border-bottom: 1px solid #e3e8ef; line-height: 1.5; }
  #closebtn, #mapbtn { background: #eef2f7; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; color: var(--ink); }
  .dbtns { float: right; display: flex; gap: 8px; }
  .reg { font-weight: 800; font-size: 14px; font-family: "Segoe UI", Arial, sans-serif; background: #fcd34d; color: #111; border: 1.5px solid #1f2733; border-radius: 5px; padding: 1px 8px; letter-spacing: 1.5px; white-space: nowrap; }
  .pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: auto; white-space: nowrap; }
  .pill.moving { background: #dcfce7; color: var(--green); }
  .pill.parked { background: #e8edf4; color: var(--muted); }
  .pill.stale { background: #fef3c7; color: var(--amber); }
  .pill.verystale { background: #fee2e2; color: var(--red); }
  .pill.comp-ok { background: #dcfce7; color: var(--green); margin-left: 0; }
  .pill.comp-warn { background: #fef3c7; color: var(--amber); margin-left: 0; }
  .pill.comp-bad { background: #fee2e2; color: var(--red); margin-left: 0; }
  .pill.comp-none { background: #e8edf4; color: var(--muted); margin-left: 0; }
  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .row .label { color: var(--muted); }
  .addr { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.45; border-top: 1px dashed var(--border); padding-top: 8px; }
  .comp { margin-top: 9px; border-top: 2px solid var(--border); padding-top: 8px; }
  .comp-title { font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .6px; margin-bottom: 4px; }
  .due-ok { color: var(--green); font-weight: 600; }
  .due-warn { color: var(--amber); font-weight: 700; }
  .due-bad { color: var(--red); font-weight: 700; }
  .warn { color: var(--red); font-weight: 600; }
  .recall { background: #fee2e2; color: var(--red); font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 6px; margin-top: 7px; display: inline-block; }
  .advisories { font-size: 11.5px; color: var(--amber); margin-top: 5px; line-height: 1.4; }
  footer { text-align: center; font-size: 11.5px; color: var(--muted); padding: 8px 0 22px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
  .dot.moving { background: var(--green); } .dot.parked { background: var(--blue); }
  .dot.stale { background: var(--amber); } .dot.verystale { background: var(--red); }
  .swatch { display: inline-block; width: 13px; height: 13px; border-radius: 4px; border: 1px solid #94a3b8; flex: none; }
  .booked { background: #dbeafe; color: var(--blue); font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 6px; margin-top: 7px; display: inline-block; }
  .pill.hs-home { background: #dcfce7; color: var(--green); margin-left: 0; }
  .pill.hs-away { background: #fee2e2; color: var(--red); margin-left: 0; }
  .pill.hs-move { background: #dbeafe; color: var(--blue); margin-left: 0; }
  .home-head { padding: 20px 20px 0; display: flex; align-items: center; gap: 10px; }
  .home-head:after { content: ""; flex: 1; height: 1px; background: #d4dbe5; margin-left: 6px; }
  .tl { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px #fff, 0 1px 3px rgba(16,24,40,.3); }
  .home-head h2 { font-size: 17px; font-weight: 800; letter-spacing: .2px; }
  .home-head .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #loadmsg { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  #loadmsg.error { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>Heart &amp; Home Living — Fleet Live Dashboard</h1>
  <span class="badge-sandbox">SANDBOX</span>
  <div class="header-stats">
    <span>Vehicles: <b id="stat-total">–</b></span>
    <span>Moving: <b id="stat-moving">–</b></span>
    <span>Stale GPS: <b id="stat-stale">–</b></span>
    <span>Away from base: <b id="stat-away">–</b></span>
    <span>Compliance alerts: <b id="stat-comp">–</b></span>
    <span>Refreshed: <b id="stat-time">–</b></span>
  </div>
</header>
<div id="map"></div>
<div id="loadmsg">Loading live fleet data…</div>
<div id="cards"></div>
<div id="overlay"><div class="detail" id="detail"></div></div>
<footer>Data: TrackIt247 + DVSA + compliance registry · Auto-refreshes every 5 minutes · Positions older than 3h flagged stale</footer>
<script>
const DATA_URL = 'https://ruthbloch.app.n8n.cloud/webhook/fleet-data';

const HOME_FILTER = (new URLSearchParams(location.search).get('home') || '').trim();
if (HOME_FILTER) {
  const nice = HOME_FILTER.charAt(0).toUpperCase() + HOME_FILTER.slice(1).toLowerCase();
  document.querySelector('header h1').textContent = 'Heart & Home Living — ' + nice + ' House Vehicles';
  document.title = nice + ' House Vehicles (Sandbox)';
}

const map = L.map('map').setView([52.5, -1.0], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
let markerLayer = L.layerGroup().addTo(map);

function render(payload) {
  if (HOME_FILTER) {
    const hf = HOME_FILTER.toLowerCase();
    payload = {
      generatedAt: payload.generatedAt,
      homes: payload.homes || [],
      vehicles: (payload.vehicles || []).filter(v => v.compliance && String(v.compliance.home || '').toLowerCase() === hf),
      untracked: (payload.untracked || []).filter(c => String(c.home || '').toLowerCase() === hf)
    };
  }
  const vehicles = payload.vehicles || [];
  const now = new Date();
  const colourMap = { white:'#f8fafc', yellow:'#facc15', grey:'#9ca3af', gray:'#9ca3af', blue:'#3b82f6', silver:'#cbd5e1', red:'#ef4444', black:'#1f2937', green:'#22c55e', orange:'#f97316' };
  function swatchHtml(c) {
    if (!c || !c.colour) return '';
    const col = colourMap[String(c.colour).toLowerCase()] || '#9ca3af';
    return '<span class="swatch" style="background:' + col + '" title="' + c.colour + '"></span>';
  }
  function carDesc(c) {
    if (!c || !c.make) return '';
    return (c.make + ' ' + (c.model || '')).trim() + (c.colour ? ' \u00b7 ' + c.colour : '');
  }
  function formatReg(r) {
    const x = String(r || '').toUpperCase();
    return x.length === 7 ? x.slice(0, 4) + ' ' + x.slice(4) : x;
  }

  function classify(v) {
    const pos = new Date((v.PositionTime || '').replace(' ', 'T'));
    const ageH = (now - pos) / 36e5;
    if (isNaN(ageH) || ageH > 24) return 'verystale';
    if (ageH > 3) return 'stale';
    return (v.SpeedKPH || 0) > 3 ? 'moving' : 'parked';
  }
  function ago(ts) {
    if (!ts) return 'unknown';
    const d = new Date(ts.replace(' ', 'T'));
    const m = Math.round((now - d) / 6e4);
    if (isNaN(m)) return ts;
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.floor(m / 60);
    if (h < 48) return h + 'h ' + (m % 60) + 'm ago';
    return Math.floor(h / 24) + ' days ago';
  }
  function battWarn(v) {
    const num = parseFloat(String(v.BatteryLevel || '').replace('v',''));
    return !isNaN(num) && num < 12.0;
  }
  function isoDay(x) {
    if (!x) return null;
    const t = new Date(x);
    if (isNaN(t)) return null;
    t.setUTCHours(t.getUTCHours() + 12);
    return t.toISOString().slice(0, 10);
  }
  function daysTo(dateStr) {
    const s = isoDay(dateStr);
    if (!s) return null;
    return Math.ceil((new Date(s) - now) / 864e5);
  }
  function dueCell(dateStr) {
    const d = daysTo(dateStr);
    if (d === null) return '<span class="label">not set</span>';
    const date = isoDay(dateStr);
    if (d < 0) return '<span class="due-bad">' + date + ' (overdue ' + Math.abs(d) + 'd)</span>';
    if (d <= 30) return '<span class="due-warn">' + date + ' (' + d + 'd)</span>';
    return '<span class="due-ok">' + date + ' (' + d + 'd)</span>';
  }
  function compClass(c) {
    if (!c) return 'comp-none';
    const s = String(c.complianceStatus || '');
    if (s.indexOf('OVERDUE') >= 0 || s.indexOf('RECALL') >= 0) return 'comp-bad';
    if (s.indexOf('DUE SOON') >= 0) return 'comp-warn';
    if (s.indexOf('OK') >= 0) return 'comp-ok';
    return 'comp-none';
  }
  function compText(c) {
    if (!c) return 'NOT IN REGISTRY';
    let t = c.complianceStatus || 'NO DATA';
    const defs = [['MOT', c.motExpiry], ['Service', c.nextServiceDue], ['Insurance', c.insuranceExpiry], ['Breakdown', c.breakdownExpiry], ['Tax', c.taxDueDate]];
    const reasons = [];
    for (let i = 0; i < defs.length; i++) {
      const d = daysTo(defs[i][1]);
      if (d === null) continue;
      if (d < 0) reasons.push(defs[i][0] + ' overdue ' + Math.abs(d) + 'd');
      else if (d <= 30) reasons.push(defs[i][0] + ' due ' + isoDay(defs[i][1]));
    }
    if (reasons.length) t += ' · ' + reasons.join(' · ');
    return t;
  }
  function compHtml(c) {
    if (!c) return '<div class="comp"><div class="comp-title">COMPLIANCE</div><span style="font-size:12px;color:var(--muted)">No registry entry</span></div>';
    let h = '<div class="comp"><div class="comp-title">COMPLIANCE</div>';
    h += '<div class="row"><span class="label">MOT expiry</span>' + dueCell(c.motExpiry) + '</div>';
    h += '<div class="row"><span class="label">Next service</span>' + dueCell(c.nextServiceDue) + '</div>';
    h += '<div class="row"><span class="label">Insurance</span>' + (c.insuranceExpiry ? dueCell(c.insuranceExpiry) : '<span>' + (c.leaseProvider === 'Owned' ? 'Owned' : (c.leaseProvider || '—')) + '</span>') + '</div>';
    h += '<div class="row"><span class="label">Breakdown cover</span>' + dueCell(c.breakdownExpiry) + '</div>';
    h += '<div class="row"><span class="label">Road tax due</span>' + dueCell(c.taxDueDate) + '</div>';
    if (c.motOdometer) h += '<div class="row"><span class="label">Mileage at last MOT</span><span>' + Number(c.motOdometer).toLocaleString() + ' mi</span></div>';
    if (c.estOdometer) h += '<div class="row"><span class="label">Est. mileage now</span><span>' + Number(Math.round(c.estOdometer)).toLocaleString() + ' mi</span></div>';
    if (c.bookedDate && daysTo(c.bookedDate) >= -1) h += '<div class="booked">📅 Booked in: ' + isoDay(c.bookedDate) + (c.bookedDetail ? ' — ' + c.bookedDetail : '') + '</div>';
    if (c.hasOutstandingRecall === 'true') h += '<div class="recall">⚠ OUTSTANDING SAFETY RECALL</div>';
    if (c.motAdvisories) h += '<div class="advisories">Advisories: ' + c.motAdvisories + '</div>';
    h += '</div>';
    return h;
  }

  const labels = { moving: 'MOVING', parked: 'PARKED', stale: 'STALE GPS', verystale: 'VERY STALE' };
  const colors = { moving: '#16a34a', parked: '#2563eb', stale: '#d97706', verystale: '#dc2626' };

  markerLayer.clearLayers();
  const markers = {};
  const bounds = [];
  vehicles.forEach(v => {
    if (typeof v.Lat !== 'number' || typeof v.Lon !== 'number') return;
    const cls = classify(v);
    const mk = L.circleMarker([v.Lat, v.Lon], {
      radius: 9, color: '#fff', weight: 2, fillColor: colors[cls], fillOpacity: 0.95
    }).addTo(markerLayer);
    let pop = '<b>' + (v.compliance ? formatReg(v.compliance.reg) : v.Registration) + '</b>' + (carDesc(v.compliance) ? '<br>' + carDesc(v.compliance) : '') + '<br>' + labels[cls] +
      ' · ' + (v.SpeedKPH || 0) + ' km/h<br>Battery: ' + (v.BatteryLevel || '?') +
      '<br>Position: ' + ago(v.PositionTime);
    if (v.compliance && v.compliance.motExpiry) pop += '<br>MOT: ' + isoDay(v.compliance.motExpiry);
    pop += '<br><small>' + (v.Address || '').replaceAll('- ', ', ') + '</small>';
    mk.bindPopup(pop);
    markers[v.Registration] = mk;
    bounds.push([v.Lat, v.Lon]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [35, 35] });

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';
  let movingCount = 0, staleCount = 0, compCount = 0, awayCount = 0;

  function hsPill(v) {
    if (!v.homeStatus) return '';
    if (v.homeStatus === 'AT HOME') return '<span class="pill hs-home">🏠 AT HOME</span>';
    if (v.homeStatus === 'ON THE MOVE') return '<span class="pill hs-move">▶ ON THE MOVE</span>';
    const d = (v.homeDistanceMiles !== null && v.homeDistanceMiles !== undefined) ? ' · ' + v.homeDistanceMiles + ' mi' : '';
    return '<span class="pill hs-away">AWAY' + d + '</span>';
  }

  function drow(label, valHtml) {
    return '<div class="drow"><span class="label">' + label + '</span><span class="val">' + valHtml + '</span></div>';
  }
  function num(x) { return (x || x === 0) ? Number(Math.round(x)).toLocaleString('en-GB') : '<span class="label">—</span>'; }
  function money(x) {
    if (x === null || x === undefined) return '<span class="label">—</span>';
    if (x === 0) return '<span class="due-ok">£0</span>';
    return '<span class="due-bad">£' + Number(x).toLocaleString('en-GB') + '</span>';
  }
  function openDetail(v) {
    const c = v.compliance || {};
    const el = document.getElementById('detail');
    const reg = c.reg ? formatReg(c.reg) : (v.Registration || '?');
    let projEnd = null, projExcess = null;
    if (c.estOdometer && c.leaseEnd && c.contractMileage && c.contractStartMileage) {
      const end = new Date(c.leaseEnd);
      const start = new Date(end);
      start.setMonth(start.getMonth() - 36);
      const used = c.estOdometer - c.contractStartMileage;
      const elapsed = (now - start) / 864e5;
      const remaining = Math.max(0, (end - now) / 864e5);
      if (elapsed > 30 && used > 0) {
        projEnd = Math.round(used + (used / elapsed) * remaining);
        const over = projEnd - c.contractMileage;
        projExcess = (over > 0 && c.excessPencePerMile) ? Math.round(over * c.excessPencePerMile / 100) : 0;
      }
    }
    let h = '<div class="dbtns">' + (v._untracked ? '' : '<button id="mapbtn">Map</button>') + '<button id="closebtn">Close</button></div>';
    h += '<h2><span class="reg">' + reg + '</span> ' + (carDesc(c) || '') + '</h2>';
    h += '<div class="sub">' + (c.home ? c.home + ' House · ' : '') + (c.leaseProvider === 'Owned' ? 'Owned' : (c.leaseProvider ? 'Leased · ' + c.leaseProvider : '')) + (v.homeStatus ? ' · ' + v.homeStatus + (v.homeStatus === 'AWAY' && v.homeDistanceMiles !== null ? ' (' + v.homeDistanceMiles + ' mi from base)' : '') : '') + '</div>';
    h += '<div class="dgrid">';
    h += '<div class="dsec">Compliance</div>';
    h += drow('MOT expiry', dueCell(c.motExpiry));
    h += drow('Last MOT result', c.motLastResult || '—');
    h += drow('Next service', dueCell(c.nextServiceDue));
    h += drow('Road tax due', dueCell(c.taxDueDate));
    h += drow('Insurance', c.insuranceExpiry ? dueCell(c.insuranceExpiry) : (c.leaseProvider === 'Owned' ? 'Owned' : (c.leaseProvider || '—')));
    h += drow('Breakdown cover', dueCell(c.breakdownExpiry));
    h += drow('Outstanding recall', c.hasOutstandingRecall === 'true' ? '<span class="due-bad">YES</span>' : (c.hasOutstandingRecall === 'false' ? 'No' : 'unknown'));
    h += drow('Booked in', (c.bookedDate && daysTo(c.bookedDate) >= -1) ? isoDay(c.bookedDate) + (c.bookedDetail ? ' — ' + c.bookedDetail : '') : 'No');
    h += '<div class="dsec">Mileage</div>';
    h += drow('Mileage at last MOT', num(c.motOdometer));
    h += drow('Estimated mileage now', num(c.estOdometer));
    h += drow('Miles this month', (c.estOdometer && (c.odoMonthStart || c.odoMonthStart === 0)) ? num(c.estOdometer - c.odoMonthStart) : '<span class="label">—</span>');
    h += drow('Contract miles', num(c.contractMileage));
    h += drow('Projected at lease end', num(projEnd));
    h += drow('Projected excess cost', money(projExcess));
    h += '<div class="dsec">Upkeep and tracking</div>';
    h += drow('Lease ends', dueCell(c.leaseEnd));
    h += drow('Last weekly check', c.lastCheckDate ? String(c.lastCheckDate).slice(0, 10) : '<span class="due-bad">never</span>');
    h += drow('Servicing', c.serviceGarageName || '—');
    h += drow('GPS position', v._untracked ? 'no tracker' : ago(v.PositionTime));
    h += drow('Tracker battery', v.BatteryLevel ? (battWarn(v) ? '<span class="due-bad">' + v.BatteryLevel + ' ⚠ low</span>' : v.BatteryLevel) : '—');
    h += drow('Last DVSA check', c.lastChecked ? isoDay(c.lastChecked) : '—');
    if (c.motAdvisories) h += '<div class="dwide">MOT advisories: ' + c.motAdvisories + '</div>';
    if (!v._untracked) h += '<div class="dwide" style="color:var(--muted)">Last known location: ' + (v.Address || 'unknown').replaceAll('- ', ', ') + '</div>';
    h += '</div>';
    el.innerHTML = h;
    document.getElementById('overlay').className = 'open';
    document.getElementById('closebtn').onclick = closeDetail;
    const mb = document.getElementById('mapbtn');
    if (mb) mb.onclick = function() {
      closeDetail();
      const mk = markers[v.Registration];
      if (mk) { map.setView(mk.getLatLng(), 15); mk.openPopup(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    };
  }
  function closeDetail() { document.getElementById('overlay').className = ''; }
  document.getElementById('overlay').onclick = function(e) { if (e.target === this) closeDetail(); };

  function buildCard(v) {
    const c = v.compliance;
    const card = document.createElement('div');
    const cc = compClass(c);
    card.className = 'card ' + cc;
    if (cc === 'comp-warn' || cc === 'comp-bad') compCount++;
    const reg = c ? formatReg(c.reg) : (v.Registration || '?');
    const bookedOn = (c && c.bookedDate && daysTo(c.bookedDate) >= -1) ? isoDay(c.bookedDate) : '';
    let topPills = '';
    let statusLine = '';
    if (v._untracked) {
      topPills = '<span class="pill parked">NO TRACKER</span>';
    } else {
      const cls = classify(v);
      if (cls === 'moving') movingCount++;
      if (cls === 'stale' || cls === 'verystale') staleCount++;
      if (v.homeStatus === 'AWAY') awayCount++;
      topPills = hsPill(v) + (battWarn(v) ? '<span class="pill comp-bad">⚠ BATTERY</span>' : '');
    }
    statusLine = '<span class="pill ' + cc + '">' + compText(c) + '</span>' +
      (bookedOn ? '<span class="pill hs-move">📅 ' + bookedOn + '</span>' : '');
    card.innerHTML =
      '<div class="card-top"><span class="reg">' + reg + '</span>' + swatchHtml(c) + topPills + '</div>' +
      '<div class="veh-line">' + (carDesc(c) || '—') + '</div>' +
      '<div class="pills">' + statusLine + '</div>';
    card.onclick = () => openDetail(v);
    return card;
  }

  const all = vehicles.concat((payload.untracked || []).map(c => ({ compliance: c, _untracked: true })));
  const groups = {};
  all.forEach(v => {
    const home = (v.compliance && v.compliance.home) ? v.compliance.home : 'Unassigned';
    (groups[home] = groups[home] || []).push(v);
  });
  Object.keys(groups).sort().forEach(home => {
    const vs = groups[home];
    const atBase = vs.filter(x => x.homeStatus === 'AT HOME').length;
    const withStatus = vs.filter(x => x.homeStatus).length;
    const ccs = vs.map(x => compClass(x.compliance));
    const tl = ccs.indexOf('comp-bad') >= 0 ? '#dc2626' : (ccs.indexOf('comp-warn') >= 0 ? '#d97706' : '#16a34a');
    const tlTitle = tl === '#dc2626' ? 'Action needed' : (tl === '#d97706' ? 'Due soon' : 'All OK');
    const prof = (payload.homes || []).find(h => h.home === home);
    const mgrTxt = (prof && prof.manager) ? ' · Manager: ' + prof.manager + (prof.deputy ? ' · Deputy: ' + prof.deputy : '') : '';
    const head = document.createElement('div');
    head.className = 'home-head';
    head.innerHTML = '<span class="tl" style="background:' + tl + '" title="' + tlTitle + '"></span><h2>' + home + '</h2><span class="sub">' + vs.length + ' vehicle' + (vs.length === 1 ? '' : 's') +
      (withStatus ? ' · ' + atBase + ' of ' + withStatus + ' at base' : '') + mgrTxt + '</span>';
    cardsEl.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'grid';
    vs.forEach(v => grid.appendChild(buildCard(v)));
    cardsEl.appendChild(grid);
  });

  document.getElementById('stat-total').textContent = vehicles.length + (payload.untracked || []).length;
  document.getElementById('stat-moving').textContent = movingCount;
  document.getElementById('stat-stale').textContent = staleCount;
  const awayEl = document.getElementById('stat-away');
  awayEl.textContent = awayCount;
  awayEl.className = awayCount > 0 ? 'alert' : '';
  const compEl = document.getElementById('stat-comp');
  compEl.textContent = compCount;
  compEl.className = compCount > 0 ? 'alert' : '';
  document.getElementById('stat-time').textContent = new Date(payload.generatedAt).toLocaleTimeString('en-GB');
  document.getElementById('loadmsg').style.display = 'none';
}

async function load() {
  const msg = document.getElementById('loadmsg');
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    render(payload);
  } catch (e) {
    msg.style.display = 'block';
    msg.className = 'error';
    msg.textContent = 'Could not load fleet data (' + e.message + '). Retrying in 60 seconds…';
    setTimeout(load, 60000);
  }
}

load();
setInterval(load, 300000);
</script>
</body>
</html>
