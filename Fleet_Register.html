<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHL Fleet Register (Sandbox)</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1f2733; --muted: #6b7686;
    --green: #16a34a; --amber: #d97706; --red: #dc2626; --blue: #2563eb;
    --border: #c2cbd6; --zebra: #f1f4f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { background: #101828; color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 600; }
  .badge-sandbox { background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: .5px; }
  .header-stats { margin-left: auto; font-size: 12.5px; color: #cbd5e1; }
  .header-stats b { color: #fff; }
  .tablewrap { overflow: auto; margin: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; max-height: calc(100vh - 130px); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1.5px solid var(--border); white-space: nowrap; vertical-align: middle; }
  thead th { position: sticky; top: 0; background: #e6ebf2; z-index: 3; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: #3d4756; cursor: pointer; user-select: none; border-bottom: 2px solid #9aa7b8; }
  thead th:hover { background: #dde3ec; }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: var(--zebra); }
  tbody tr:hover { background: #e3ecf9; }
  .reg-cell { font-weight: 700; }
  .due-ok { color: var(--green); font-weight: 600; }
  .due-warn { color: var(--amber); font-weight: 700; }
  .due-bad { color: var(--red); font-weight: 700; }
  .muted { color: var(--muted); }
  .tl { display: inline-block; width: 13px; height: 13px; border-radius: 50%; vertical-align: -2px; margin-right: 7px; box-shadow: 0 0 0 2px #fff, 0 1px 2px rgba(16,24,40,.3); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid #94a3b8; margin-right: 6px; vertical-align: -1px; }
  .pill { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .comp-ok { background: #dcfce7; color: var(--green); }
  .comp-warn { background: #fef3c7; color: var(--amber); }
  .comp-bad { background: #fee2e2; color: var(--red); }
  .comp-none { background: #e8edf4; color: var(--muted); }
  #loadmsg { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  #loadmsg.error { color: var(--red); }
  footer { text-align: center; font-size: 11.5px; color: var(--muted); padding: 4px 0 18px; }
  #overlay { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: none; align-items: flex-start; justify-content: center; padding: 30px 14px; z-index: 50; overflow: auto; }
  #overlay.open { display: flex; }
  .detail { background: #fff; border-radius: 14px; max-width: 680px; width: 100%; padding: 24px 26px; box-shadow: 0 10px 40px rgba(16,24,40,.35); }
  .detail h2 { font-size: 18px; margin-bottom: 2px; }
  .detail .sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
  .drow { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid #e3e8ef; }
  .drow .label { color: var(--muted); }
  .drow .val { text-align: right; }
  .dsec { grid-column: 1 / -1; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; padding: 14px 0 2px; }
  .dwide { grid-column: 1 / -1; font-size: 12.5px; color: var(--amber); padding: 7px 0; border-bottom: 1px solid #e3e8ef; line-height: 1.5; }
  #closebtn { float: right; background: #eef2f7; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Heart &amp; Home Living — Fleet Register</h1>
  <span class="badge-sandbox">SANDBOX</span>
  <div class="header-stats">Vehicles: <b id="stat-total">–</b> · Updated: <b id="stat-time">–</b></div>
</header>
<div id="loadmsg">Loading fleet register…</div>
<div class="tablewrap" id="tablewrap" style="display:none">
  <table id="regtable">
    <thead><tr id="headrow"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<footer>Click a vehicle for full details · Click a column heading to sort · Data refreshes every 5 minutes</footer>
<div id="overlay"><div class="detail" id="detail"></div></div>
<script>
const DATA_URL = 'https://ruthbloch.app.n8n.cloud/webhook/fleet-data';
const HOME_FILTER = (new URLSearchParams(location.search).get('home') || '').trim();
if (HOME_FILTER) {
  const nice = HOME_FILTER.charAt(0).toUpperCase() + HOME_FILTER.slice(1).toLowerCase();
  document.querySelector('header h1').textContent = 'Heart & Home Living — ' + nice + ' House Fleet Register';
  document.title = nice + ' House Fleet Register (Sandbox)';
}
const colourMap = { white:'#f8fafc', yellow:'#facc15', grey:'#9ca3af', gray:'#9ca3af', blue:'#3b82f6', silver:'#cbd5e1', red:'#ef4444', black:'#1f2937', green:'#22c55e', orange:'#f97316' };
let rows = [];
let sortKey = 'reg', sortDir = 1;

const COLS = [
  { key: 'reg', label: 'Reg' },
  { key: 'vehicle', label: 'Vehicle' },
  { key: 'colour', label: 'Colour' },
  { key: 'motExpiry', label: 'MOT' },
  { key: 'booked', label: 'Booked' },
  { key: 'taxDueDate', label: 'Tax Due' }
];

function formatReg(r) {
  const x = String(r || '').toUpperCase();
  return x.length === 7 ? x.slice(0, 4) + ' ' + x.slice(4) : x;
}
function isoDay(x) {
  if (!x) return null;
  const t = new Date(x);
  if (isNaN(t)) return null;
  t.setUTCHours(t.getUTCHours() + 12);
  return t.toISOString().slice(0, 10);
}
function d10(x) { return isoDay(x) || ''; }
function daysTo(dateStr) {
  const s = isoDay(dateStr);
  if (!s) return null;
  return Math.ceil((new Date(s) - new Date()) / 864e5);
}
function dueCell(dateStr) {
  const d = daysTo(dateStr);
  if (d === null) return '<span class="muted">not set</span>';
  const date = d10(dateStr);
  if (d < 0) return '<span class="due-bad">' + date + ' (overdue ' + Math.abs(d) + 'd)</span>';
  if (d <= 30) return '<span class="due-warn">' + date + ' (' + d + 'd)</span>';
  return '<span class="due-ok">' + date + '</span>';
}
function tlFor(dateStr) {
  const d = daysTo(dateStr);
  if (d === null) return '#9ca3af';
  if (d < 0) return '#dc2626';
  if (d <= 30) return '#d97706';
  return '#16a34a';
}

function toRow(v) {
  const c = v.compliance || {};
  let projEnd = null, projExcess = null;
  if (c.estOdometer && c.leaseEnd && c.contractMileage && c.contractStartMileage) {
    const end = new Date(c.leaseEnd);
    const start = new Date(end);
    start.setMonth(start.getMonth() - 36);
    const nowD = new Date();
    const used = c.estOdometer - c.contractStartMileage;
    const elapsed = (nowD - start) / 864e5;
    const remaining = Math.max(0, (end - nowD) / 864e5);
    if (elapsed > 30 && used > 0) {
      projEnd = Math.round(used + (used / elapsed) * remaining);
      const over = projEnd - c.contractMileage;
      projExcess = (over > 0 && c.excessPencePerMile) ? Math.round(over * c.excessPencePerMile / 100) : 0;
    }
  }
  const bookedOn = (c.bookedDate && daysTo(c.bookedDate) >= -1) ? d10(c.bookedDate) : '';
  return {
    reg: c.reg ? formatReg(c.reg) : (v.Registration || ''),
    vehicle: ((c.make || '') + ' ' + (c.model || '')).trim() || '—',
    colour: c.colour || '',
    motExpiry: c.motExpiry || null,
    booked: bookedOn,
    bookedDetail: c.bookedDetail || '',
    taxDueDate: c.taxDueDate || null,
    home: c.home || '',
    homeStatus: v.homeStatus ? (v.homeStatus === 'AWAY' && v.homeDistanceMiles !== null && v.homeDistanceMiles !== undefined ? 'AWAY · ' + v.homeDistanceMiles + ' mi' : v.homeStatus) : '',
    status: c.complianceStatus || 'NO DATA',
    ownership: c.leaseProvider || '',
    motLastResult: c.motLastResult || '',
    motOdometer: c.motOdometer || null,
    estOdometer: c.estOdometer ? Math.round(c.estOdometer) : null,
    milesMonth: (c.estOdometer && (c.odoMonthStart || c.odoMonthStart === 0)) ? Math.round(c.estOdometer - c.odoMonthStart) : null,
    nextServiceDue: c.nextServiceDue || null,
    insuranceExpiry: c.insuranceExpiry || null,
    insuranceWho: c.insuranceExpiry ? null : (c.leaseProvider === 'Owned' ? 'Owned' : (c.leaseProvider || null)),
    breakdownExpiry: c.breakdownExpiry || null,
    leaseEnd: c.leaseEnd || null,
    contractMileage: c.contractMileage || null,
    contractStartMileage: c.contractStartMileage || null,
    excessPencePerMile: c.excessPencePerMile || null,
    projEnd: projEnd,
    projExcess: projExcess,
    lastCheck: c.lastCheckDate ? String(c.lastCheckDate).slice(0, 10) : '',
    serviceGarage: c.serviceGarageName || '',
    motGarage: c.motGarageName || '',
    recall: c.hasOutstandingRecall === 'true' ? 'YES' : (c.hasOutstandingRecall === 'false' ? 'No' : 'unknown'),
    advisories: c.motAdvisories || '',
    lastChecked: d10(c.lastChecked),
    liveAddress: (v.Address || '').replaceAll('- ', ', ')
  };
}

function cellHtml(row, col) {
  const val = row[col.key];
  if (col.key === 'reg') return '<span class="reg-cell">' + val + '</span>';
  if (col.key === 'colour') {
    if (!val) return '<span class="muted">—</span>';
    const cc = colourMap[String(val).toLowerCase()] || '#9ca3af';
    return '<span class="swatch" style="background:' + cc + '"></span>' + val;
  }
  if (col.key === 'motExpiry') {
    return '<span class="tl" style="background:' + tlFor(val) + '"></span>' + (dueCell(val));
  }
  if (col.key === 'booked') {
    return val ? '<span class="pill comp-ok">YES · ' + val + '</span>' : '<span class="pill comp-none">NO</span>';
  }
  if (col.key === 'taxDueDate') return dueCell(val);
  return val ? String(val) : '<span class="muted">—</span>';
}

function drow(label, valHtml) {
  return '<div class="drow"><span class="label">' + label + '</span><span class="val">' + valHtml + '</span></div>';
}
function money(v) {
  if (v === null || v === undefined) return '<span class="muted">—</span>';
  if (v === 0) return '<span class="due-ok">£0</span>';
  return '<span class="due-bad">£' + Number(v).toLocaleString('en-GB') + '</span>';
}
function num(v) { return (v || v === 0) ? Number(v).toLocaleString('en-GB') : '<span class="muted">—</span>'; }

function openDetail(r) {
  const el = document.getElementById('detail');
  let h = '<button id="closebtn">Close</button>';
  h += '<h2>' + r.reg + ' — ' + r.vehicle + '</h2>';
  h += '<div class="sub">' + (r.home ? r.home + ' House · ' : '') + (r.ownership === 'Owned' ? 'Owned' : 'Leased · ' + (r.ownership || '?')) + (r.homeStatus ? ' · ' + r.homeStatus : '') + '</div>';
  h += '<div class="dgrid">';
  h += '<div class="dsec">Compliance</div>';
  h += drow('MOT expiry', dueCell(r.motExpiry));
  h += drow('Last MOT result', r.motLastResult || '—');
  h += drow('Next service', dueCell(r.nextServiceDue));
  h += drow('Road tax due', dueCell(r.taxDueDate));
  h += drow('Insurance', r.insuranceExpiry ? dueCell(r.insuranceExpiry) : (r.insuranceWho || '—'));
  h += drow('Breakdown cover', dueCell(r.breakdownExpiry));
  h += drow('Outstanding recall', r.recall === 'YES' ? '<span class="due-bad">YES</span>' : r.recall);
  h += drow('Booked in', r.booked ? r.booked + (r.bookedDetail ? ' — ' + r.bookedDetail : '') : 'No');
  h += '<div class="dsec">Mileage</div>';
  h += drow('Mileage at last MOT', num(r.motOdometer));
  h += drow('Estimated mileage now', num(r.estOdometer));
  h += drow('Miles this month', num(r.milesMonth));
  h += drow('Contract miles', num(r.contractMileage));
  h += drow('Miles at handover', num(r.contractStartMileage));
  h += drow('Excess p/mile', r.excessPencePerMile ? r.excessPencePerMile + 'p' : '—');
  h += drow('Projected at lease end', num(r.projEnd));
  h += drow('Projected excess cost', money(r.projExcess));
  h += '<div class="dsec">Upkeep</div>';
  h += drow('Lease ends', dueCell(r.leaseEnd));
  h += drow('Last weekly check', r.lastCheck ? r.lastCheck : '<span class="due-bad">never</span>');
  h += drow('Servicing', r.serviceGarage || '—');
  h += drow('MOT garage', r.motGarage || '—');
  h += drow('Last DVSA check', r.lastChecked || '—');
  if (r.advisories) h += '<div class="dwide">MOT advisories: ' + r.advisories + '</div>';
  h += '<div class="dwide" style="color:var(--muted)">Last known location: ' + (r.liveAddress || 'unknown') + '</div>';
  h += '</div>';
  el.innerHTML = h;
  document.getElementById('overlay').className = 'open';
  document.getElementById('closebtn').onclick = closeDetail;
}
function closeDetail() { document.getElementById('overlay').className = ''; }
document.getElementById('overlay').onclick = function(e) { if (e.target === this) closeDetail(); };

function drawTable() {
  const head = document.getElementById('headrow');
  head.innerHTML = COLS.map(c => '<th data-key="' + c.key + '">' + c.label + (sortKey === c.key ? (sortDir > 0 ? ' ▲' : ' ▼') : '') + '</th>').join('');
  head.querySelectorAll('th').forEach(th => {
    th.onclick = () => {
      const k = th.getAttribute('data-key');
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
      drawTable();
    };
  });
  const sorted = rows.slice().sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x === null || x === '' || x === undefined) return 1;
    if (y === null || y === '' || y === undefined) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * sortDir;
    return String(x).localeCompare(String(y)) * sortDir;
  });
  const tb = document.getElementById('tbody');
  tb.innerHTML = sorted.map((r, i) =>
    '<tr data-i="' + i + '">' + COLS.map(c => '<td>' + cellHtml(r, c) + '</td>').join('') + '</tr>'
  ).join('');
  tb.querySelectorAll('tr').forEach(tr => {
    tr.onclick = () => openDetail(sorted[Number(tr.getAttribute('data-i'))]);
  });
}

async function load() {
  const msg = document.getElementById('loadmsg');
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    rows = (payload.vehicles || []).map(toRow).concat((payload.untracked || []).map(c => toRow({ compliance: c })));
    if (HOME_FILTER) rows = rows.filter(r => String(r.home || '').toLowerCase() === HOME_FILTER.toLowerCase());
    drawTable();
    document.getElementById('stat-total').textContent = rows.length;
    document.getElementById('stat-time').textContent = new Date(payload.generatedAt).toLocaleTimeString('en-GB');
    msg.style.display = 'none';
    document.getElementById('tablewrap').style.display = 'block';
  } catch (e) {
    msg.style.display = 'block';
    msg.className = 'error';
    msg.textContent = 'Could not load fleet data (' + e.message + '). Retrying in 60 seconds…';
    setTimeout(load, 60000);
  }
}

load();
setInterval(load, 300000);
</script>
</body>
</html>
